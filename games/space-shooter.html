<body>
  <div class="stage" id="stage">

<script>
(() => {
  'use strict';

  /* ================= Screen ================= */
  const W = 224, H = 256;
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const muteBtn = document.getElementById('mute');
  const HI_KEY = 'space-shooter-hi';
  const MUTE_KEY = 'space-shooter-muted';
  const calm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ================= Helpers ================= */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const overlap = (ax, ay, aw, ah, bx, by, bw, bh) =>
    ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  const pad5 = n => String(n).padStart(5, '0');
  const store = {
    get(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v === null ? fallback : v;
      } catch (e) {
        return fallback;
      }
    },
    set(key, value) {
      try { localStorage.setItem(key, String(value)); } catch (e) { /* storage unavailable */ }
    }
  };

  /* ================= Pixel art =================
     Everything is drawn in white. The coloured strips
     (red at the top, green at the bottom) are laid over
     the finished frame, like the old arcade screen overlays. */
  function sprite(rows) {
    const h = rows.length, w = rows[0].length;
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const g = c.getContext('2d');
    g.fillStyle = '#fff';
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (rows[y][x] === '#' || rows[y][x] === '1') g.fillRect(x, y, 1, 1);
      }
    }
    return { img: c, w, h, rows };
  }

  const SPR = {
    player: sprite([
      '......#......',
      '.....###.....',
      '.....#.#.....',
      '....##.##....',
      '#...#####...#',
      '#..#######..#',
      '##.#######.##',
      '#############',
      '##..#...#..##'
    ]),
    crystal: [
      sprite(['...#...', '..###..', '.##.##.', '##...##', '.##.##.', '..###..', '...#...']),
      sprite(['#..#..#', '.#.#.#.', '..###..', '###.###', '..###..', '.#.#.#.', '#..#..#'])
    ],
    bat: [
      sprite(['#...#.#...#', '##.#####.##', '####.#.####', '.#########.', '....###....', '.....#.....']),
      sprite(['....#.#....', '...#####...', '.###.#.###.', '###########', '##..###..##', '#....#....#'])
    ],
    robot: [
      sprite(['...#.....', '....#....', '.#######.', '##.###.##', '#########', '#.#.#.#.#', '.#######.', '.##...##.']),
      sprite(['.....#...', '....#....', '.#######.', '##.###.##', '#########', '#.#.#.#.#', '.#######.', '##.....##'])
    ],
    ufo: sprite([
      '.....#####.....',
      '....#..#..#....',
      '..###########..',
      '###############',
      '.#############.',
      '...#...#...#...'
    ]),
    boom: sprite([
      '....#.#....',
      '.#...#...#.',
      '..#.....#..',
      '#..#...#..#',
      '...........',
      '#..#...#..#',
      '..#.....#..',
      '.#...#...#.',
      '....#.#....'
    ]),
    wreck: [
      sprite([
        '.....#.......',
        '..#......#...',
        '......#....#.',
        '#..#.#.##....',
        '...#######...',
        '.#.########..',
        '..##########.',
        '.############',
        '#############'
      ]),
      sprite([
        '#.......#....',
        '....#.......#',
        '.#.....#.....',
        '...#.#...#.#.',
        '#..######....',
        '..#########.#',
        '.##########..',
        '############.',
        '#############'
      ])
    ],
    splat: sprite(['.#...#.', '#..#..#', '..###..', '.#####.', '..###..', '#..#..#', '.#...#.']),
    zig: [
      sprite(['.#.', '#..', '.#.', '..#', '.#.', '#..', '.#.']),
      sprite(['.#.', '..#', '.#.', '#..', '.#.', '..#', '.#.'])
    ],
    bolt: [
      sprite(['.#.', '.#.', '###', '.#.', '.#.', '.#.', '.#.']),
      sprite(['.#.', '.#.', '.#.', '.#.', '###', '.#.', '.#.'])
    ]
  };

  /* ================= 5x7 pixel font ================= */
  const FONT_SRC = {
    A: '01110 10001 10001 11111 10001 10001 10001',
    B: '11110 10001 10001 11110 10001 10001 11110',
    C: '01110 10001 10000 10000 10000 10001 01110',
    D: '11110 10001 10001 10001 10001 10001 11110',
    E: '11111 10000 10000 11110 10000 10000 11111',
    F: '11111 10000 10000 11110 10000 10000 10000',
    G: '01110 10001 10000 10111 10001 10001 01111',
    H: '10001 10001 10001 11111 10001 10001 10001',
    I: '01110 00100 00100 00100 00100 00100 01110',
    J: '00111 00010 00010 00010 00010 10010 01100',
    K: '10001 10010 10100 11000 10100 10010 10001',
    L: '10000 10000 10000 10000 10000 10000 11111',
    M: '10001 11011 10101 10101 10001 10001 10001',
    N: '10001 10001 11001 10101 10011 10001 10001',
    O: '01110 10001 10001 10001 10001 10001 01110',
    P: '11110 10001 10001 11110 10000 10000 10000',
    Q: '01110 10001 10001 10001 10101 10010 01101',
    R: '11110 10001 10001 11110 10100 10010 10001',
    S: '01111 10000 10000 01110 00001 00001 11110',
    T: '11111 00100 00100 00100 00100 00100 00100',
    U: '10001 10001 10001 10001 10001 10001 01110',
    V: '10001 10001 10001 10001 10001 01010 00100',
    W: '10001 10001 10001 10101 10101 10101 01010',
    X: '10001 10001 01010 00100 01010 10001 10001',
    Y: '10001 10001 01010 00100 00100 00100 00100',
    Z: '11111 00001 00010 00100 01000 10000 11111',
    '0': '01110 10001 10011 10101 11001 10001 01110',
    '1': '00100 01100 00100 00100 00100 00100 01110',
    '2': '01110 10001 00001 00010 00100 01000 11111',
    '3': '11111 00010 00100 00010 00001 10001 01110',
    '4': '00010 00110 01010 10010 11111 00010 00010',
    '5': '11111 10000 11110 00001 00001 10001 01110',
    '6': '00110 01000 10000 11110 10001 10001 01110',
    '7': '11111 00001 00010 00100 01000 01000 01000',
    '8': '01110 10001 10001 01110 10001 10001 01110',
    '9': '01110 10001 10001 01111 00001 00010 01100',
    '-': '00000 00000 00000 11111 00000 00000 00000',
    ':': '00000 01100 01100 00000 01100 01100 00000',
    '!': '00100 00100 00100 00100 00100 00000 00100',
    '.': '00000 00000 00000 00000 00000 01100 01100',
    '=': '00000 00000 11111 00000 11111 00000 00000',
    '?': '01110 10001 00001 00010 00100 00000 00100',
    '*': '00000 00100 10101 01110 10101 00100 00000'
  };
  const FONT = {};
  for (const ch of Object.keys(FONT_SRC)) FONT[ch] = sprite(FONT_SRC[ch].split(' '));

  function textWidth(s, scale = 1) {
    return s.length ? (s.length * 6 - 1) * scale : 0;
  }

  function drawText(s, x, y, scale = 1, align = 'left') {
    s = String(s);
    const w = textWidth(s, scale);
    if (align === 'center') x = Math.round(x - w / 2);
    else if (align === 'right') x -= w;
    for (let i = 0; i < s.length; i++) {
      const g = FONT[s[i]];
      if (g) ctx.drawImage(g.img, x + i * 6 * scale, y, 5 * scale, 7 * scale);
    }
  }

  /* ================= Sound (simple beeps, Web Audio) ================= */
  const audio = {
    ctx: null,
    out: null,
    noiseBuf: null,
    muted: store.get(MUTE_KEY, '0') === '1',
    unlock() {
      if (this.ctx) {
        if (this.ctx.state === 'suspended') {
          const p = this.ctx.resume();
          if (p && p.catch) p.catch(() => {});
        }
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        this.ctx = new AC();
        this.out = this.ctx.createGain();
        this.out.gain.value = 0.6;
        this.out.connect(this.ctx.destination);
      } catch (e) {
        this.ctx = null;
      }
    },
    ready() {
      return !!this.ctx && !this.muted && this.ctx.state === 'running';
    },
    tone(freq, dur, type = 'square', vol = 0.05, slideTo = 0, delay = 0) {
      if (!this.ready()) return;
      const c = this.ctx, t = c.currentTime + delay;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(this.out);
      o.start(t);
      o.stop(t + dur + 0.02);
    },
    noise(dur, vol = 0.2, cutoff = 2000) {
      if (!this.ready()) return;
      const c = this.ctx, t = c.currentTime;
      if (!this.noiseBuf) {
        const len = c.sampleRate;
        this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
        const d = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      src.buffer = this.noiseBuf;
      f.type = 'lowpass';
      f.frequency.setValueAtTime(cutoff, t);
      f.frequency.exponentialRampToValueAtTime(80, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f);
      f.connect(g);
      g.connect(this.out);
      src.start(t);
      src.stop(t + dur + 0.02);
    }
  };

  const MARCH = [98, 87, 78, 73];
  const sfx = {
    shoot: () => audio.tone(1400, 0.08, 'square', 0.03, 300),
    kill: () => audio.noise(0.2, 0.3, 3000),
    die: () => { audio.noise(0.9, 0.4, 1600); audio.tone(220, 0.8, 'sawtooth', 0.035, 40); },
    march: n => audio.tone(MARCH[n % 4], 0.09, 'square', 0.06),
    ufo: high => audio.tone(high ? 740 : 560, 0.11, 'triangle', 0.03),
    ufoHit: () => audio.tone(1000, 0.45, 'square', 0.035, 150),
    extra: () => [523, 659, 784, 1047].forEach((f, i) => audio.tone(f, 0.09, 'square', 0.03, 0, i * 0.08)),
    over: () => [392, 330, 262, 196].forEach((f, i) => audio.tone(f, 0.2, 'square', 0.035, 0, i * 0.18))
  };

  /* ================= Game constants ================= */
  const COLS = 11, ROWS = 5, CELL_W = 16, CELL_H = 14;
  const UFO_Y = 20, BUNKER_Y = 188, PLAYER_Y = 222, GROUND_Y = 237;
  const BW = 22, BH = 16; // bunker size
  const PLAYER_SPEED = 85, SHOT_SPEED = 240;
  const TYPES = [
    { frames: SPR.crystal, points: 30 },
    { frames: SPR.bat, points: 20 },
    { frames: SPR.robot, points: 10 }
  ];
  const ROW_TYPE = [0, 1, 1, 2, 2];

  /* ================= State ================= */
  let state = 'title'; // title | ready | play | dying | clear | over
  let paused = false;
  let time = 0, stateTimer = 0;
  let score = 0, lives = 3, wave = 1, extraGiven = false, invaded = false;
  let hiScore = parseInt(store.get(HI_KEY, '0'), 10) || 0;
  const player = { x: Math.round((W - SPR.player.w) / 2), alive: true };
  let shot = null, shotCooldown = 0;
  let aliens = [], bombs = [], effects = [], bunkers = [];
  const fleet = { x: 0, y: 0, dir: 1, frame: 0, timer: 0, alive: 0, note: 0 };
  let bombTimer = 0, ufo = null, ufoTimer = 0, lastMarch = -1;
  const input = { left: false, right: false, fire: false };
  let touchUI = false;

  const stars = Array.from({ length: 42 }, () => ({
    x: randInt(0, W - 1),
    y: randInt(14, GROUND_Y - 3),
    shade: ['#2c2c2c', '#454545', '#626262'][randInt(0, 2)],
    twinkle: Math.random() < 0.25,
    phase: rand(0, Math.PI * 2),
    speed: rand(0.6, 1.4)
  }));

  const blinkOn = rate => calm || Math.floor(time * rate) % 2 === 0;

  /* ================= Game flow ================= */
  function newGame() {
    score = 0;
    lives = 3;
    wave = 1;
    extraGiven = false;
    startWave();
  }

  function startWave() {
    aliens = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) aliens.push({ c, r, type: TYPES[ROW_TYPE[r]], alive: true });
    }
    fleet.x = Math.floor((W - COLS * CELL_W) / 2);
    fleet.y = 40 + Math.min(wave - 1, 5) * 8; // each wave starts a little lower
    fleet.dir = 1;
    fleet.frame = 0;
    fleet.timer = 0;
    fleet.alive = aliens.length;
    bombs = [];
    effects = [];
    shot = null;
    ufo = null;
    ufoTimer = rand(14, 22);
    bombTimer = 1.2;
    shotCooldown = 0;
    invaded = false;
    buildBunkers();
    player.x = Math.round((W - SPR.player.w) / 2);
    player.alive = true;
    state = 'ready';
    stateTimer = 1.8;
  }

  function startIfIdle() {
    if (state === 'title' || (state === 'over' && stateTimer > 1.2)) {
      newGame();
      return true;
    }
    return false;
  }

  function canPause() {
    return state === 'ready' || state === 'play' || state === 'dying' || state === 'clear';
  }

  function setPaused(p) {
    if (p && !canPause()) return;
    paused = p;
  }

  function addScore(n) {
    score += n;
    if (score > hiScore) hiScore = score;
    if (!extraGiven && score >= 1500) {
      extraGiven = true;
      lives++;
      effects.push({ text: 'EXTRA SHIP', x: W / 2, y: 172, t: 1.6 });
      sfx.extra();
    }
  }

  function killPlayer() {
    if (!player.alive) return;
    player.alive = false;
    state = 'dying';
    stateTimer = 1.6;
    bombs = [];
    shot = null;
    sfx.die();
  }

  function afterDeath() {
    lives = invaded ? 0 : lives - 1;
    if (lives <= 0) {
      gameOver();
      return;
    }
    player.alive = true;
    player.x = Math.round((W - SPR.player.w) / 2);
    state = 'play';
    bombTimer = 1.2;
    shotCooldown = 0.25;
  }

  function gameOver() {
    state = 'over';
    stateTimer = 0;
    ufo = null;
    bombs = [];
    shot = null;
    if (score > hiScore) hiScore = score;
    store.set(HI_KEY, hiScore);
    sfx.over();
  }

  /* ================= Aliens ================= */
  function alienRect(a) {
    const s = a.type.frames[0];
    return {
      x: fleet.x + a.c * CELL_W + ((CELL_W - s.w) >> 1),
      y: fleet.y + a.r * CELL_H + ((8 - s.h) >> 1),
      w: s.w,
      h: s.h
    };
  }

  function fleetBounds() {
    let minX = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const a of aliens) {
      if (!a.alive) continue;
      const r = alienRect(a);
      if (r.x < minX) minX = r.x;
      if (r.x + r.w > maxX) maxX = r.x + r.w;
      if (r.y + r.h > maxY) maxY = r.y + r.h;
    }
    return { minX, maxX, maxY };
  }

  // The fewer aliens are left, the faster they march (and each wave is a little quicker).
  function stepInterval() {
    const waveFactor = Math.max(0.6, Math.pow(0.92, wave - 1));
    return Math.max(1 / 60, fleet.alive * 0.0155 * waveFactor);
  }

  function fleetStep() {
    const b = fleetBounds();
    const dx = 2 * fleet.dir;
    const atEdge = fleet.dir > 0 ? b.maxX + dx > W - 4 : b.minX + dx < 4;
    if (atEdge) {
      fleet.y += 8;
      fleet.dir = -fleet.dir;
    } else {
      fleet.x += dx;
    }
    fleet.frame ^= 1;
    if (time - lastMarch > 0.07) {
      sfx.march(fleet.note++);
      lastMarch = time;
    }
    erodeBunkers();
    if (fleetBounds().maxY >= PLAYER_Y) {
      invaded = true;
      killPlayer();
    }
  }

  function updateFleet(dt) {
    fleet.timer += dt;
    let steps = 0;
    let interval = stepInterval();
    while (fleet.timer >= interval) {
      fleet.timer -= interval;
      fleetStep();
      if (state !== 'play') return;
      if (++steps >= 6) {
        fleet.timer = 0;
        return;
      }
      interval = stepInterval();
    }
  }

  function killAlien(a, r) {
    a.alive = false;
    fleet.alive--;
    addScore(a.type.points);
    addFx(SPR.boom, r.x + ((r.w - SPR.boom.w) >> 1), r.y + ((r.h - SPR.boom.h) >> 1), 0.25);
    sfx.kill();
    if (fleet.alive <= 0) {
      state = 'clear';
      stateTimer = 1.6;
      bombs = [];
      ufo = null;
    }
  }

  function alienFire(dt) {
    bombTimer -= dt;
    const maxBombs = Math.min(5, 2 + Math.floor((wave - 1) / 2));
    if (bombTimer > 0 || bombs.length >= maxBombs) return;
    bombTimer = rand(0.5, 1.2) * Math.max(0.45, Math.pow(0.88, wave - 1));

    // only the lowest alien in each column can shoot
    const shooters = [];
    for (let c = 0; c < COLS; c++) {
      for (let r = ROWS - 1; r >= 0; r--) {
        const a = aliens[r * COLS + c];
        if (a.alive) {
          shooters.push(a);
          break;
        }
      }
    }
    if (!shooters.length) return;

    let a = shooters[randInt(0, shooters.length - 1)];
    if (Math.random() < Math.min(0.55, 0.25 + 0.05 * (wave - 1))) {
      // sometimes aim at the player
      const px = player.x + SPR.player.w / 2;
      let best = Infinity;
      for (const s of shooters) {
        const r = alienRect(s);
        const d = Math.abs(r.x + r.w / 2 - px);
        if (d < best) {
          best = d;
          a = s;
        }
      }
    }
    const r = alienRect(a);
    const kind = Math.random() < 0.5 ? 'zig' : 'bolt';
    const speed = Math.min(130, 68 + wave * 6) * (kind === 'bolt' ? 1.2 : 1);
    bombs.push({ x: r.x + (r.w >> 1) - 1, y: r.y + r.h, kind, speed, t: 0 });
  }

  /* ================= Bunkers ================= */
  function buildBunkers() {
    bunkers = [];
    for (let i = 0; i < 4; i++) {
      const cx = Math.round(W * (2 * i + 1) / 8);
      const px = new Uint8Array(BW * BH);
      for (let y = 0; y < BH; y++) {
        for (let x = 0; x < BW; x++) {
          let on = !(y < 4 && (x < 4 - y || x > BW - 1 - (4 - y))); // rounded top corners
          if (y >= 11 && Math.abs(x - (BW - 1) / 2) < [3, 4, 5, 5, 5][y - 11]) on = false; // arch
          px[y * BW + x] = on ? 1 : 0;
        }
      }
      const cv = document.createElement('canvas');
      cv.width = BW;
      cv.height = BH;
      bunkers.push({ x: cx - BW / 2, y: BUNKER_Y, px, cv, g: cv.getContext('2d'), dirty: true });
    }
  }

  // First solid bunker pixel inside a rectangle, scanning in the direction of travel.
  function bunkerHit(rx, ry, rw, rh, dir) {
    for (const b of bunkers) {
      if (!overlap(rx, ry, rw, rh, b.x, b.y, BW, BH)) continue;
      const x0 = Math.max(0, Math.floor(rx - b.x)), x1 = Math.min(BW - 1, Math.ceil(rx + rw - b.x) - 1);
      const y0 = Math.max(0, Math.floor(ry - b.y)), y1 = Math.min(BH - 1, Math.ceil(ry + rh - b.y) - 1);
      if (dir < 0) {
        for (let y = y1; y >= y0; y--) {
          for (let x = x0; x <= x1; x++) if (b.px[y * BW + x]) return { b, x, y };
        }
      } else {
        for (let y = y0; y <= y1; y++) {
          for (let x = x0; x <= x1; x++) if (b.px[y * BW + x]) return { b, x, y };
        }
      }
    }
    return null;
  }

  function damageBunker(h, dir) {
    const b = h.b;
    const cx = h.x, cy = h.y + dir * 2;
    for (let dy = -3; dy <= 3; dy++) {
      for (let dx = -3; dx <= 3; dx++) {
        const d2 = dx * dx + dy * dy;
        if (d2 > 10) continue;
        if (dx !== 0 && d2 > 2 && Math.random() < 0.4) continue; // ragged edges
        const x = cx + dx, y = cy + dy;
        if (x >= 0 && x < BW && y >= 0 && y < BH) b.px[y * BW + x] = 0;
      }
    }
    b.dirty = true;
  }

  // Aliens that march into a bunker wipe it out where they touch.
  function erodeBunkers() {
    for (const a of aliens) {
      if (!a.alive) continue;
      const r = alienRect(a);
      if (r.y + r.h <= BUNKER_Y) continue;
      for (const b of bunkers) {
        if (!overlap(r.x, r.y, r.w, r.h, b.x, b.y, BW, BH)) continue;
        const x0 = Math.max(0, r.x - b.x), x1 = Math.min(BW, r.x + r.w - b.x);
        const y0 = Math.max(0, r.y - b.y), y1 = Math.min(BH, r.y + r.h - b.y);
        for (let y = y0; y < y1; y++) {
          for (let x = x0; x < x1; x++) b.px[y * BW + x] = 0;
        }
        b.dirty = true;
      }
    }
  }

  function drawBunkers() {
    for (const b of bunkers) {
      if (b.dirty) {
        b.g.clearRect(0, 0, BW, BH);
        b.g.fillStyle = '#fff';
        for (let y = 0; y < BH; y++) {
          for (let x = 0; x < BW; x++) if (b.px[y * BW + x]) b.g.fillRect(x, y, 1, 1);
        }
        b.dirty = false;
      }
      ctx.drawImage(b.cv, b.x, b.y);
    }
  }

  /* ================= Player, shots, bombs, saucer ================= */
  function movePlayer(dt) {
    const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    player.x = clamp(player.x + dir * PLAYER_SPEED * dt, 4, W - 4 - SPR.player.w);
  }

  function updatePlayer(dt) {
    movePlayer(dt);
    shotCooldown -= dt;
    if (input.fire && !shot && shotCooldown <= 0) {
      shot = { x: Math.round(player.x) + 6, y: PLAYER_Y - 3 };
      shotCooldown = 0.12;
      sfx.shoot();
    }
  }

  function updateShot(dt) {
    if (!shot) return;
    const prevY = shot.y;
    shot.y -= SHOT_SPEED * dt;
    const x = shot.x, top = shot.y, h = prevY + 4 - shot.y; // swept area, so nothing gets skipped

    const bh = bunkerHit(x, top, 1, h, -1);
    if (bh) {
      damageBunker(bh, -1);
      addFx(SPR.splat, bh.b.x + bh.x - 3, bh.b.y + bh.y - 3, 0.12);
      shot = null;
      return;
    }

    for (let i = 0; i < bombs.length; i++) {
      const b = bombs[i];
      if (overlap(x - 1, top, 3, h, b.x, b.y, 3, 7)) {
        bombs.splice(i, 1);
        addFx(SPR.splat, b.x - 2, b.y, 0.12);
        shot = null;
        return;
      }
    }

    for (const a of aliens) {
      if (!a.alive) continue;
      const r = alienRect(a);
      if (overlap(x, top, 1, h, r.x, r.y, r.w, r.h)) {
        shot = null;
        killAlien(a, r);
        return;
      }
    }

    if (ufo && overlap(x, top, 1, h, ufo.x, UFO_Y, SPR.ufo.w, SPR.ufo.h)) {
      shot = null;
      killUfo();
      return;
    }

    if (shot.y < 15) {
      addFx(SPR.splat, x - 3, 14, 0.12);
      shot = null;
    }
  }

  function spriteHits(s, sx, sy, rx, ry, rw, rh) {
    const x0 = Math.max(0, Math.floor(rx - sx)), x1 = Math.min(s.w - 1, Math.ceil(rx + rw - sx) - 1);
    const y0 = Math.max(0, Math.floor(ry - sy)), y1 = Math.min(s.h - 1, Math.ceil(ry + rh - sy) - 1);
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) if (s.rows[y][x] === '#') return true;
    }
    return false;
  }

  function updateBombs(dt) {
    for (let i = bombs.length - 1; i >= 0; i--) {
      const b = bombs[i];
      const prevY = b.y;
      b.y += b.speed * dt;
      b.t += dt;
      const h = b.y + 7 - prevY;

      if (player.alive && spriteHits(SPR.player, Math.round(player.x), PLAYER_Y, b.x, prevY, 3, h)) {
        killPlayer();
        return;
      }

      const bh = bunkerHit(b.x, prevY, 3, h, 1);
      if (bh) {
        damageBunker(bh, 1);
        addFx(SPR.splat, bh.b.x + bh.x - 3, bh.b.y + bh.y - 1, 0.12);
        bombs.splice(i, 1);
        continue;
      }

      if (b.y + 7 >= GROUND_Y) {
        addFx(SPR.splat, b.x - 2, GROUND_Y - 7, 0.15);
        bombs.splice(i, 1);
      }
    }
  }

  function updateUfo(dt) {
    if (ufo) {
      ufo.x += ufo.dir * 38 * dt;
      ufo.beep -= dt;
      if (ufo.beep <= 0) {
        ufo.beep = 0.12;
        ufo.high = !ufo.high;
        sfx.ufo(ufo.high);
      }
      if (ufo.x > W + 4 || ufo.x < -SPR.ufo.w - 4) ufo = null;
      return;
    }
    ufoTimer -= dt;
    if (ufoTimer <= 0) {
      if (fleet.alive >= 8) {
        const dir = Math.random() < 0.5 ? 1 : -1;
        ufo = { x: dir > 0 ? -SPR.ufo.w : W, dir, beep: 0, high: false };
        ufoTimer = rand(18, 28);
      } else {
        ufoTimer = 4;
      }
    }
  }

  function killUfo() {
    const pts = [50, 100, 150, 300][randInt(0, 3)];
    addScore(pts);
    effects.push({ text: String(pts), x: Math.round(ufo.x + SPR.ufo.w / 2), y: UFO_Y - 1, t: 1.4 });
    ufo = null;
    sfx.ufoHit();
  }

  function addFx(spr, x, y, t) {
    effects.push({ spr, x: Math.round(x), y: Math.round(y), t });
  }

  function updateEffects(dt) {
    for (let i = effects.length - 1; i >= 0; i--) {
      effects[i].t -= dt;
      if (effects[i].t <= 0) effects.splice(i, 1);
    }
  }

  /* ================= Update ================= */
  function update(dt) {
    time += dt;
    updateEffects(dt);
    switch (state) {
      case 'ready':
        movePlayer(dt);
        stateTimer -= dt;
        if (stateTimer <= 0) state = 'play';
        break;
      case 'play':
        updatePlayer(dt);
        updateShot(dt);
        if (state !== 'play') break;
        updateFleet(dt);
        if (state !== 'play') break;
        alienFire(dt);
        updateBombs(dt);
        if (state !== 'play') break;
        updateUfo(dt);
        break;
      case 'dying':
        stateTimer -= dt;
        if (stateTimer <= 0) afterDeath();
        break;
      case 'clear':
        movePlayer(dt);
        stateTimer -= dt;
        if (stateTimer <= 0) {
          wave++;
          startWave();
        }
        break;
      case 'over':
        stateTimer += dt;
        break;
    }
  }

  /* ================= Draw ================= */
  function drawStars() {
    for (const s of stars) {
      const bright = !calm && s.twinkle && Math.sin(time * s.speed + s.phase) > 0.92;
      ctx.fillStyle = bright ? '#9a9a9a' : s.shade;
      ctx.fillRect(s.x, s.y, 1, 1);
    }
  }

  function drawHud() {
    drawText('SCORE', 4, 5);
    drawText(pad5(score), 40, 5);
    const hs = pad5(hiScore);
    drawText(hs, W - 4, 5, 1, 'right');
    drawText('HI', W - 4 - textWidth(hs) - 6 - textWidth('HI'), 5);
    if (state !== 'title') {
      drawText(String(Math.max(0, lives)), 4, 243);
      const spare = Math.min(Math.max(0, lives - 1), 4);
      for (let i = 0; i < spare; i++) ctx.drawImage(SPR.player.img, 14 + i * 16, 242);
      drawText('WAVE ' + wave, W - 4, 243, 1, 'right');
    }
  }

  function drawTitle() {
    drawText('SPACE', W / 2, 40, 3, 'center');
    drawText('SHOOTER', W / 2, 66, 3, 'center');
    drawText('*SCORE TABLE*', W / 2, 100, 1, 'center');
    const f = calm ? 0 : Math.floor(time * 2) & 1;
    const rows = [
      [SPR.ufo, '= ? MYSTERY'],
      [SPR.crystal[f], '= 30 POINTS'],
      [SPR.bat[f], '= 20 POINTS'],
      [SPR.robot[f], '= 10 POINTS']
    ];
    const x0 = Math.round((W - (22 + textWidth(rows[0][1]))) / 2);
    rows.forEach(([s, label], i) => {
      const y = 114 + i * 14;
      ctx.drawImage(s.img, x0 + ((16 - s.w) >> 1), y + Math.floor((7 - s.h) / 2));
      drawText(label, x0 + 22, y);
    });
    if (blinkOn(1.6)) drawText(touchUI ? 'TAP TO START' : 'PRESS SPACE TO START', W / 2, 172, 1, 'center');
    ctx.drawImage(SPR.player.img, Math.round((W - SPR.player.w) / 2), PLAYER_Y);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, GROUND_Y, W, 1);
  }

  function drawPlay() {
    drawBunkers();
    for (const a of aliens) {
      if (!a.alive) continue;
      const r = alienRect(a);
      ctx.drawImage(a.type.frames[fleet.frame].img, r.x, r.y);
    }
    if (ufo) ctx.drawImage(SPR.ufo.img, Math.round(ufo.x), UFO_Y);

    const px = Math.round(player.x);
    if (player.alive) ctx.drawImage(SPR.player.img, px, PLAYER_Y);
    else if (state === 'dying') ctx.drawImage(SPR.wreck[Math.floor(time * 10) & 1].img, px, PLAYER_Y);

    ctx.fillStyle = '#fff';
    if (shot) ctx.fillRect(shot.x, Math.round(shot.y), 1, 4);
    for (const b of bombs) ctx.drawImage(SPR[b.kind][Math.floor(b.t * 10) & 1].img, b.x, Math.round(b.y));
    for (const e of effects) {
      if (e.spr) ctx.drawImage(e.spr.img, e.x, e.y);
      else drawText(e.text, e.x, e.y, 1, 'center');
    }
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, GROUND_Y, W, 1);

    if (state === 'ready') {
      drawText('WAVE ' + wave, W / 2, 148, 2, 'center');
      drawText('GET READY', W / 2, 168, 1, 'center');
    } else if (state === 'over') {
      const title = 'GAME OVER';
      const prompt = stateTimer > 1.2 && blinkOn(1.6);
      panel(124, [
        [title, 2, Math.min(title.length, Math.floor(stateTimer * 9))],
        ['SCORE ' + score, 1],
        [touchUI ? 'TAP TO PLAY AGAIN' : 'PRESS SPACE TO PLAY', 1, prompt ? undefined : 0]
      ]);
    }
  }

  // A black box with a thin border and centred lines: [text, scale, charsToShow?]
  function panel(cy, lines) {
    let w = 0, h = -6;
    for (const [t, s] of lines) {
      w = Math.max(w, textWidth(t, s));
      h += 7 * s + 6;
    }
    const bw = w + 20, bh = h + 18;
    const bx = Math.round((W - bw) / 2), by = Math.round(cy - bh / 2);
    ctx.fillStyle = '#000';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#fff';
    ctx.fillRect(bx, by, bw, 1);
    ctx.fillRect(bx, by + bh - 1, bw, 1);
    ctx.fillRect(bx, by, 1, bh);
    ctx.fillRect(bx + bw - 1, by, 1, bh);
    let y = by + 9;
    for (const [t, s, n] of lines) {
      const x = Math.round((W - textWidth(t, s)) / 2);
      drawText(n === undefined ? t : t.slice(0, n), x, y, s);
      y += 7 * s + 6;
    }
  }

  // Coloured screen overlay: red strip for the saucer lane, green for the bottom.
  function tint() {
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = '#ff5a4f';
    ctx.fillRect(0, 17, W, 16);
    ctx.fillStyle = '#4dff72';
    ctx.fillRect(0, 182, W, 56);
    ctx.fillRect(0, 238, 96, H - 238);
    ctx.globalCompositeOperation = 'source-over';
  }

  function draw() {
    ctx.imageSmoothingEnabled = false;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    drawStars();
    if (state === 'title') drawTitle();
    else drawPlay();
    drawHud();
    if (paused) panel(124, [['PAUSED', 2], [touchUI ? 'TAP TO RESUME' : 'PRESS P TO RESUME', 1]]);
    tint();
  }

  /* ================= Input ================= */
  const KEYS = {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    Space: 'fire', ArrowUp: 'fire', KeyW: 'fire', KeyZ: 'fire', KeyX: 'fire'
  };

  window.addEventListener('keydown', e => {
    // Let Enter/Space follow a focused link (the Home link) instead of driving the game.
    if (e.target instanceof Element && e.target.closest('a[href]')) return;
    audio.unlock();
    setTouchUI(false);
    const k = KEYS[e.code];
    if (k) {
      input[k] = true;
      e.preventDefault();
    }
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (paused) setPaused(false);
      else startIfIdle();
    } else if (e.code === 'KeyP' || e.code === 'Escape') {
      setPaused(!paused);
    } else if (e.code === 'KeyM') {
      toggleMute();
    }
  });

  window.addEventListener('keyup', e => {
    const k = KEYS[e.code];
    if (k) {
      input[k] = false;
      e.preventDefault();
    }
  });

  // Touch buttons: hold to move or fire, and you can slide a finger between them.
  const pads = Array.from(document.querySelectorAll('.pad [data-key]')).map(btn => ({
    btn,
    key: btn.dataset.key,
    held: new Set()
  }));

  function syncPad(p) {
    const on = p.held.size > 0;
    input[p.key] = on;
    p.btn.classList.toggle('down', on);
  }

  for (const p of pads) {
    const btn = p.btn;
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      audio.unlock();
      if (e.pointerType === 'touch') setTouchUI(true);
      if (btn.hasPointerCapture && btn.hasPointerCapture(e.pointerId)) btn.releasePointerCapture(e.pointerId);
      p.held.add(e.pointerId);
      syncPad(p);
      if (p.key === 'fire') {
        if (paused) setPaused(false);
        else startIfIdle();
      }
    });
    btn.addEventListener('pointerenter', e => {
      if (e.pointerType !== 'mouse' && (e.buttons & 1)) {
        p.held.add(e.pointerId);
        syncPad(p);
      }
    });
    for (const type of ['pointerup', 'pointercancel', 'pointerleave']) {
      btn.addEventListener(type, e => {
        p.held.delete(e.pointerId);
        syncPad(p);
      });
    }
    btn.addEventListener('contextmenu', e => e.preventDefault());
  }

  function releaseAll() {
    input.left = input.right = input.fire = false;
    for (const p of pads) {
      p.held.clear();
      p.btn.classList.remove('down');
    }
  }

  canvas.addEventListener('pointerdown', e => {
    audio.unlock();
    if (e.pointerType === 'touch') setTouchUI(true);
    try { window.focus(); } catch (err) { /* ignore */ }
    if (paused) {
      setPaused(false);
      return;
    }
    if (startIfIdle()) return;
    if (canPause()) setPaused(true);
  });

  window.addEventListener('blur', () => {
    releaseAll();
    setPaused(true);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      releaseAll();
      setPaused(true);
    }
  });
  window.addEventListener('pagehide', () => store.set(HI_KEY, hiScore));

  function refreshMute() {
    muteBtn.textContent = audio.muted ? 'Unmute' : 'Mute';
  }

  function toggleMute() {
    audio.muted = !audio.muted;
    store.set(MUTE_KEY, audio.muted ? '1' : '0');
    refreshMute();
  }

  muteBtn.addEventListener('click', () => {
    audio.unlock();
    toggleMute();
    muteBtn.blur();
  });

  /* ================= Layout ================= */
  function setTouchUI(on) {
    if (touchUI === on) return;
    touchUI = on;
    document.body.classList.toggle('touch', on);
    fit();
  }

  // Scale the 224x256 screen up as big as fits, using whole device pixels when that costs little space.
  function fit() {
    const r = stage.getBoundingClientRect();
    const aw = r.width - 34, ah = r.height - 34;
    if (aw <= 0 || ah <= 0) return;
    const dpr = window.devicePixelRatio || 1;
    const s = Math.min(aw / W, ah / H);
    let scale = s;
    const sd = s * dpr;
    if (sd >= 2) {
      const whole = Math.floor(sd);
      if (whole / sd >= 0.84) scale = whole / dpr;
    }
    canvas.style.width = W * scale + 'px';
    canvas.style.height = H * scale + 'px';
  }

  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
  window.addEventListener('resize', fit);

  /* ================= Main loop ================= */
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (!paused) update(dt);
    draw();
  }

  refreshMute();
  setTouchUI(!!(window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches));
  fit();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
