<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" height="auto" style="background:#ffffff;">
  <!-- Triangle ABC -->
  <polygon points="120,90 200,210 60,210" fill="none" stroke="#000000" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Angle A Arc (Single Arc with tick) -->
  <path d="M 110.2 109.7 A 22 22 0 0 0 132.2 108.3" fill="none" stroke="#000000" stroke-width="1.4"/>
  <!-- Angle B Arc (Single Arc) -->
  <path d="M 80 210 A 20 20 0 0 0 68.9 192.1" fill="none" stroke="#000000" stroke-width="1.4"/>
  <!-- Angle C Arcs (Double Arc) -->
  <path d="M 180 210 A 20 20 0 0 1 188.9 193.4" fill="none" stroke="#000000" stroke-width="1.4"/>
  <path d="M 176 210 A 24 24 0 0 1 186.7 190.0" fill="none" stroke="#000000" stroke-width="1.4"/>

  <!-- Triangle ABC Labels -->
  <!-- Vertices -->
  <text x="120" y="78" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">A</text>
  <text x="46" y="216" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">B</text>
  <text x="214" y="216" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">C</text>
  <!-- Sides -->
  <text x="80" y="146" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#000000">c</text>
  <text x="170" y="146" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#000000">b</text>
  <text x="130" y="228" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#000000" text-anchor="middle">a</text>

  <!-- Similarity Symbol between triangles -->
  <text x="265" y="155" font-family="Georgia, serif" font-size="32" fill="#000000" text-anchor="middle">∼</text>

  <!-- Triangle DEF (Scaled by 1.5) -->
  <polygon points="420,30 540,210 330,210" fill="none" stroke="#000000" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Angle D Arc (Single Arc with tick) -->
  <path d="M 407.5 55.0 A 28 28 0 0 0 435.5 53.3" fill="none" stroke="#000000" stroke-width="1.4"/>
  <!-- Angle E Arc (Single Arc) -->
  <path d="M 354 210 A 24 24 0 0 0 340.7 188.5" fill="none" stroke="#000000" stroke-width="1.4"/>
  <!-- Angle F Arcs (Double Arc) -->
  <path d="M 516 210 A 24 24 0 0 1 526.7 190.0" fill="none" stroke="#000000" stroke-width="1.4"/>
  <path d="M 511 210 A 29 29 0 0 1 523.9 185.9" fill="none" stroke="#000000" stroke-width="1.4"/>

  <!-- Triangle DEF Labels -->
  <!-- Vertices -->
  <text x="420" y="18" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">D</text>
  <text x="316" y="216" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">E</text>
  <text x="554" y="216" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">F</text>
  <!-- Sides -->
  <text x="362" y="115" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#000000">f</text>
  <text x="490" y="115" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#000000">e</text>
  <text x="435" y="228" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#000000" text-anchor="middle">d</text>
</svg>
